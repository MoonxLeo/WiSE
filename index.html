<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page On Progress</title>
    <style>
        /* Mengatur dasar halaman */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Latar belakang malam pekat */
            background: linear-gradient(135deg, #07070b 0%, #11111a 50%, #171720 100%);
            min-height: 100vh;
            position: relative;
            overflow: hidden; 
        }

        /* --- Latar Belakang Bintang Statis --- */
        .static-stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image: 
                radial-gradient(1.5px 1.5px at 10% 20%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 30% 40%, #e0e0ff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50% 10%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 70% 60%, #c0c0ff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 90% 30%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 20% 80%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 80% 80%, #d0d0ff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40% 70%, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 60% 90%, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 300px 300px;
            opacity: 0.8;
        }

        /* --- Bintang Terang (Lens Flare) Realistis dengan Animasi Floating --- */
        .bright-star {
            position: absolute;
            width: 150px;
            height: 150px;
            z-index: 0;
            pointer-events: none;
            animation: floatStar 5s ease-in-out infinite alternate;
        }
        .bright-star .core {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 6px; height: 6px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px 4px rgba(255, 255, 255, 0.9), 0 0 30px 10px rgba(180, 200, 255, 0.6);
        }
        .bright-star .rays {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 1px;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 70%);
            box-shadow: 0 0 4px rgba(255,255,255,0.4);
        }
        .bright-star .rays::after {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: inherit; transform: rotate(90deg);
        }
        .bright-star .diagonal-rays {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 40%; height: 1px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
        }
        .bright-star .diagonal-rays::after {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: inherit; transform: rotate(90deg);
        }
        
        .bs-1 { top: 10%; left: 15%; transform: scale(1.3); animation-delay: 0s; }
        .bs-2 { top: 60%; left: 75%; transform: scale(0.9); animation-delay: 1.5s; }
        .bs-3 { bottom: 15%; right: 20%; transform: scale(1.1); animation-delay: 3s; }
        .bs-4 { top: 40%; left: 8%; transform: scale(0.6); animation-delay: 2s; }

        @keyframes floatStar {
            0% { transform: translateY(0px) scale(var(--s, 1)); }
            100% { transform: translateY(-15px) scale(var(--s, 1)); }
        }

        /* --- Elemen Bulan dengan Animasi Berputar --- */
        .moon {
            position: absolute;
            top: 5%; right: 10%;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 30% 30%, transparent 0%, rgba(0,0,0,0.6) 80%),
                radial-gradient(circle at 40% 60%, #444 0%, transparent 30%),
                radial-gradient(circle at 70% 30%, #555 0%, transparent 40%),
                radial-gradient(circle at 60% 70%, #333 0%, transparent 50%),
                #888899; 
            box-shadow: inset -20px -20px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.15); 
            z-index: 0; pointer-events: none; opacity: 0.9;
            animation: rotateMoon 30s linear infinite; /* Animasi berputar */
        }

        @keyframes rotateMoon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Animasi Bintang Jatuh --- */
        .shooting-star-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .shooting-star {
            position: absolute; width: 140px; height: 1.5px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 100%);
            border-radius: 999px; top: var(--start-y); left: var(--start-x);
            animation: shoot var(--duration) infinite linear; animation-delay: var(--delay);
        }
        .shooting-star::after {
            content: ''; position: absolute; top: 50%; right: 0; 
            transform: translateY(-50%); width: 5px; height: 5px;
            background: #fff; border-radius: 50%; box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.9);
        }
        .star-1 { --angle: 25deg; --start-x: -10%; --start-y: 10%; --duration: 2s; --delay: 0s; }
        .star-2 { --angle: 145deg; --start-x: 90%; --start-y: -10%; --duration: 2.5s; --delay: 1.2s; }
        .star-3 { --angle: 60deg; --start-x: 40%; --start-y: -10%; --duration: 1.8s; --delay: 2.5s; }
        .star-4 { --angle: 170deg; --start-x: 110%; --start-y: 40%; --duration: 3s; --delay: 0.8s; }

        @keyframes shoot {
            0% { transform: rotate(var(--angle)) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            70% { opacity: 1; }
            100% { transform: rotate(var(--angle)) translateX(150vw); opacity: 0; }
        }

        /* --- Animasi Partikel Naik (Salju) --- */
        .snow-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .snow {
            position: absolute; bottom: -20px; background: #ffffff;
            border-radius: 50%; box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
            animation: floatUp infinite linear;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-105vh); opacity: 0; }
        }
        .s1 { width: 3px; height: 3px; left: 15%; animation-duration: 12s; animation-delay: 0s; }
        .s2 { width: 2px; height: 2px; left: 35%; animation-duration: 16s; animation-delay: 4s; }
        .s3 { width: 4px; height: 4px; left: 55%; animation-duration: 14s; animation-delay: 2s; }
        .s4 { width: 1.5px; height: 1.5px; left: 75%; animation-duration: 18s; animation-delay: 7s; }
        .s5 { width: 3px; height: 3px; left: 85%; animation-duration: 13s; animation-delay: 1s; }

        /* --- Styling Header --- */
        header {
            position: relative; z-index: 10; display: flex; align-items: center;
            padding: 25px 50px; background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .logo-img {
            height: 45px;
            width: auto;
            margin-right: 50px;
            cursor: pointer;
            border-radius: 6px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .logo-img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .main-nav { display: flex; gap: 30px; }
        .login-nav { margin-left: auto; display: flex; }
        nav a { position: relative; padding: 8px 12px; color: #cccccc; text-decoration: none; font-size: 16px; font-weight: 500; transition: color 0.3s ease; cursor: pointer; }
        nav a::before, nav a::after { content: ''; position: absolute; width: 10px; height: 10px; opacity: 0; transition: all 0.3s ease; }
        nav a::before { top: 0; left: 0; border-top: 2px solid white; border-left: 2px solid white; }
        nav a::after { bottom: 0; right: 0; border-bottom: 2px solid white; border-right: 2px solid white; }
        nav a:hover { color: #ffffff; }
        nav a:hover::before { top: -4px; left: -4px; opacity: 1; }
        nav a:hover::after { bottom: -4px; right: -4px; opacity: 1; }

        /* --- KONTEN HERO & KARTU LAYANAN --- */
        .hero-section {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding-top: 100px;
        }

        .hero-section h1 {
            font-size: 3em;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }

        .hero-section p.subtitle {
            color: #d1d1d1;
            font-size: 1.1em;
            letter-spacing: 0.5px;
            margin-bottom: 50px;
        }

        /* Container Kartu Pilihan */
        .services-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap; 
            max-width: 900px;
            margin: 0 auto;
        }

        /* Desain Kartu (Glassmorphism & Interaktif) */
        .service-card {
            background: rgba(255, 255, 255, 0.98);
            width: 220px;
            height: 160px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .service-card svg {
            width: 60px;
            height: 60px;
            color: #1e3a5f; 
            margin-bottom: 15px;
            transition: all 0.4s ease;
        }

        .service-card h3 {
            color: #111827;
            font-size: 20px;
            font-weight: 800;
            z-index: 1;
        }

        .service-card:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(255, 255, 255, 0.15), 0 0 20px rgba(96, 239, 255, 0.2);
        }

        .service-card:hover svg {
            transform: scale(1.15) rotate(5deg);
            color: #2563eb; 
        }

        /* --- ELEMEN ASTRONOT DIPERBESAR 2X LIPAT LAGI (760px) --- */
        .astronaut {
            position: absolute;
            width: 700px; /* Diperbesar 2x lipat dari 380px */
            z-index: -20  ;
             left: 1200px;
             top: 452px;
            pointer-events: none;
            animation: floatAstronaut 6s ease-in-out infinite alternate;
        }

        .astronaut-left {
            bottom: -80px;
            left: -80px;
            transform: rotate(-10deg);
            animation-delay: 0s;
        }

        .astronaut-right {
            bottom: -80px;
            right: -80px;
            transform: rotate(10deg);
            animation-delay: 3s; 
        }

        @keyframes floatAstronaut {
            0% {
                transform: translateY(0px) rotate(var(--rot, -10deg));
            }
            100% {
                transform: translateY(-25px) rotate(calc(var(--rot, -10deg) + 5deg));
            }
        }

        /* --- Styling Pop-Up (Modal) --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #1a1a1a; color: white; padding: 40px; border-radius: 12px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333; max-width: 400px; position: relative;
            animation: popIn 0.3s ease-out;
        }
        .modal-content h3 { margin-bottom: 15px; color: #ff4757; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; transition: color 0.3s; }
        .close-btn:hover { color: white; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <!-- Animasi Latar Belakang -->
    <div class="static-stars"></div>
    
    <!-- Bintang (+) dengan Animasi Floating -->
    <div class="bright-star bs-1" style="--s: 1.3;"><div class="core"></div><div class="rays"></div><div class="diagonal-rays"></div></div>
    <div class="bright-star bs-2" style="--s: 0.9;"><div class="core"></div><div class="rays"></div><div class="diagonal-rays"></div></div>
    <div class="bright-star bs-3" style="--s: 1.1;"><div class="core"></div><div class="rays"></div><div class="diagonal-rays"></div></div>
    <div class="bright-star bs-4" style="--s: 0.6;"><div class="core"></div><div class="rays"></div><div class="diagonal-rays"></div></div>
    
    <!-- Bulan Berputar -->
    <div class="moon"></div>

    <div class="shooting-star-container">
        <div class="shooting-star star-1"></div><div class="shooting-star star-2"></div>
        <div class="shooting-star star-3"></div><div class="shooting-star star-4"></div>
    </div>
    <div class="snow-container">
        <div class="snow s1"></div><div class="snow s2"></div><div class="snow s3"></div>
        <div class="snow s4"></div><div class="snow s5"></div>
    </div>

    <!-- Elemen Gambar Astronot Jumbo (760px) di Kiri & Kanan Bawah -->
    <img src="WiSE (1).jpg" alt="Astronot Kiri" class="astronaut astronaut-left" style="--rot: -10deg;" onerror="this.style.display='none'">
    <img src="WiSE (2).jpg" alt="Astronot Kanan" class="astronaut astronaut-right" style="--rot: 10deg;" onerror="this.style.display='none'">

    <!-- Header / Navigasi -->
    <header>
        <img src="logo.jpg" alt="Logo WiSE" class="logo-img" onclick="showPopup()">
        <nav class="main-nav">
            <a onclick="showPopup()">Home</a>
            <a onclick="showPopup()">About</a>
            <a onclick="showPopup()">Price</a>
            <a onclick="showPopup()">Contact</a>
        </nav>
        <nav class="login-nav">
            <a onclick="showPopup()">Login</a>
        </nav>
    </header>

    <!-- Konten Tengah Utama -->
    <div class="hero-section">
        <h1>Selamat Datang di WiSE</h1>
        <p class="subtitle">Building Reliability into Every Line of Code.</p>
        
        <div class="services-container">
            <!-- Kartu 1: Robotics -->
            <div class="service-card" onclick="showPopup()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <h3>Robotics</h3>
            </div>

            <!-- Kartu 2: Website -->
            <div class="service-card" onclick="showPopup()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                <h3>Website</h3>
            </div>

            <!-- Kartu 3: Design -->
            <div class="service-card" onclick="showPopup()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                </svg>
                <h3>Design</h3>
            </div>
        </div>
    </div>

    <!-- Pop-Up Modal -->
    <div class="modal-overlay" id="popupModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <h3>Oops!</h3>
            <p>Halaman Belum Tersedia karena Website masih <strong>On progress</strong>.</p>
        </div>
    </div>

    <!-- Script JavaScript untuk Pop-Up -->
    <script>
        const modal = document.getElementById('popupModal');

        function showPopup() {
            modal.style.display = 'flex';
        }

        function closePopup() {
            modal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>

</body>
</html>
